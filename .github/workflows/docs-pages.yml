name: Deploy docs site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['docs-site/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        # Version is pinned via packageManager field in package.json.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install docs-site deps
        run: pnpm install --no-frozen-lockfile
        working-directory: .
      - run: pnpm --dir docs-site exec astro build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
