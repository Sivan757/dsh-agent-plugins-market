name: Deploy docs site to GitHub Pages

on:
  push:
    branches: [main]
    # The site renders the user guide from docs/user/, so a guide edit is a site
    # edit: watching only docs-site/ would leave the deployed site stale.
    paths: ['docs-site/**', 'docs/user/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        # Version is pinned via packageManager field in package.json.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install docs-site deps
        run: pnpm install --no-frozen-lockfile
        working-directory: .
      # A page missing from the guide library renders nowhere and reports
      # nothing, so the guide's completeness and bilingual parity are checked
      # before anything is built from it.
      - run: pnpm --dir docs-site run check:guide
      # The root tsconfig projects do not cover .astro files, so the site's own
      # type check is the only thing that reads them.
      - run: pnpm --dir docs-site run check
      - run: pnpm --dir docs-site run build
      # The guide renders repository markdown and rewrites its links at build
      # time, so a wrong target is invisible until a reader follows it.
      - run: pnpm --dir docs-site run check:links
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
