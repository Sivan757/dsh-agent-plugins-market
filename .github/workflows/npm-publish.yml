name: npm-publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Force this exact version (e.g. 0.6.2). Empty = derive from conventional commits.'
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    # CI/tooling/docs changes must not open a release PR.
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - 'docs-site/**'
      - 'CHANGELOG.md'
      - '.release-please-*'
      - 'README.md'
      - 'README.zh.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'SECURITY.md'

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    steps:
      # The host dependency baseline is a release input, not a build detail: a stale
      # `@deepseek-ai/dsh-*` pin ships a peer range that excludes the host line consumers run.
      # Gate before release-please, so a drifting tree never becomes a tag and a GitHub Release
      # with no npm artifact behind it. `prepack` re-checks the same invariant inside the publish
      # job, on the exact commit the tarball is cut from.
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify host dependency alignment
        run: node scripts/check-host-alignment.mjs

      # Two release modes:
      #  - push to main: the version comes from the conventional commits since
      #    the last release (feat -> minor, fix/perf -> patch, breaking -> major).
      #  - manual dispatch with `version`: that exact version is pinned through
      #    a `Release-As:` footer commit, so a feature-heavy batch can still
      #    ship as a patch (0.6.2) or any chosen version. Empty input keeps the
      #    automatic rule.
      #
      # The action's `release-as` input is NOT used: with `config-file` (manifest
      # mode) release-please ignores it and still logged "updating from 0.6.1 to
      # 0.7.0", while the `Release-As:` commit footer reliably recomputed the same
      # candidate to 0.6.2 — verified on the 0.6.2 release.
      - name: Pin the requested version with a Release-As footer
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m "chore(release): pin this release to ${VERSION}" -m "Release-As: ${VERSION}"
          git push origin HEAD:main

      - uses: googleapis/release-please-action@v5
        id: release-please
        with:
          config-file: .release-please-config.json

  # The release-please workflow is the single release entry point.
  # Publish only when this run actually creates a GitHub release, using the
  # exact tag emitted by release-please rather than the latest release API.
  npm-publish:
    needs: release-please
    # npm 0.5.1 already exists; keep its GitHub release record without republishing it.
    if: >-
      needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.tag_name != 'dsh-agent-plugins-market-v0.5.1'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full quality gates
        run: pnpm run check:refactor && pnpm run test

      - name: Build published artifacts
        run: pnpm run build

      - name: Publish to npm via OIDC trusted publishing
        run: pnpm publish --no-git-checks --provenance
