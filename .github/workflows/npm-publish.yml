name: npm-publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Force this exact version (e.g. 0.6.2). Empty = derive from conventional commits.'
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    # CI/tooling/docs changes must not open a release PR.
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - 'docs-site/**'
      - 'CHANGELOG.md'
      - '.release-please-*'
      - 'README.md'
      - 'README.zh.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'SECURITY.md'

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    steps:
      # Two release modes:
      #  - push to main: the version comes from the conventional commits since
      #    the last release (feat -> minor, fix/perf -> patch).
      #  - manual dispatch with `version`: release-please is pinned to that
      #    exact version, so a feature-heavy batch can still ship as a patch
      #    (0.6.2) or a chosen minor/major. Empty input keeps the default.
      #
      # `release-as` only applies while release-please CREATES the release PR
      # ("PR remained the same" otherwise), so forcing a version closes any
      # open release PR first; release-please then opens a fresh one at the
      # requested version.
      - name: Reset an open release PR when a version is forced
        if: inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("release-please--")) | .number' |
          while read -r pr; do
            [ -n "$pr" ] || continue
            echo "Closing release PR #$pr so the forced version can take effect"
            gh pr close "$pr" --delete-branch || true
          done

      - uses: googleapis/release-please-action@v5
        id: release-please
        with:
          config-file: .release-please-config.json
          release-as: ${{ inputs.version }}

  # The release-please workflow is the single release entry point.
  # Publish only when this run actually creates a GitHub release, using the
  # exact tag emitted by release-please rather than the latest release API.
  npm-publish:
    needs: release-please
    # npm 0.5.1 already exists; keep its GitHub release record without republishing it.
    if: >-
      needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.tag_name != 'dsh-agent-plugins-market-v0.5.1'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full quality gates
        run: pnpm run check:refactor && pnpm run test

      - name: Build published artifacts
        run: pnpm run build

      - name: Publish to npm via OIDC trusted publishing
        run: pnpm publish --no-git-checks --provenance
