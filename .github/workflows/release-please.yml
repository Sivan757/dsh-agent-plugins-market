name: release-please

on:
  push:
    branches: [main]
    # CI/tooling/docs changes must not open a release PR.
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - 'docs-site/**'
      - 'CHANGELOG.md'
      - '.release-please-*'
      - 'README.md'
      - 'README.zh.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'SECURITY.md'

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release-please
        with:
          config-file: .release-please-config.json
