name: quality

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        # Version is pinned via packageManager field in package.json.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run full quality gates
        run: pnpm run check:refactor
      - name: Run full tests
        run: pnpm run test
      - name: Build published artifacts
        run: pnpm run build

  docs-site:
    name: Docs site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The root tsconfig projects do not include .astro files, so these three
      # steps are the only verification the site gets. They live here as well as
      # in docs-pages.yml because that workflow runs on push to main only: a
      # broken site change would otherwise pass review and fail after merge.
      - name: Check the guide is complete and bilingual
        run: pnpm --dir docs-site run check:guide
      - name: Type-check the site
        run: pnpm --dir docs-site run check
      - name: Build the site
        run: pnpm --dir docs-site run build
      - name: Check every link in the built site
        run: pnpm --dir docs-site run check:links

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
