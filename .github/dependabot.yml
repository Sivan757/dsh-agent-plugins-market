version: 2
updates:
  # One npm entry covers the whole pnpm workspace, docs-site included. A second
  # entry for `/docs-site` split each bump in two — the manifest in one PR and
  # the shared lockfile in another — so neither PR installed under
  # `--frozen-lockfile`.
  - package-ecosystem: npm
    directory: '/'
    # Updates ride the dev branch, so they merge with the next release batch
    # instead of sitting open against main until a release day.
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      # Routine development bumps arrive as one PR; a major stays its own PR.
      dev-minor-patch:
        dependency-type: development
        update-types: ['minor', 'patch']
    ignore:
      # The host line moves as one set through check:host-alignment
      # (`pnpm run fix:host-alignment`): a single dev-mirror bump would leave
      # every other mirror stale and fail the gate. Packages whose peer and dev
      # entries move together, such as @deepseek-ai/cordis, stay eligible.
      - dependency-name: '@deepseek-ai/dsh-*'
      # The DSH host pins React 18 (dsh-client-ui-* peers: ^18.2.0) and the
      # client bundle consumes the host's runtime — follow the host, not upstream.
      - dependency-name: 'react'
        versions: ['>=19']
      - dependency-name: 'react-dom'
        versions: ['>=19']
      - dependency-name: '@types/react'
        versions: ['>=19']
      - dependency-name: '@types/react-dom'
        versions: ['>=19']
      # TypeScript 6 drops ambient node types (TS2591 across src/) — a real
      # migration with a tsconfig change, not a routine bump.
      - dependency-name: 'typescript'
        versions: ['>=6']
      # `engines` starts at Node 22, so newer types would type-check APIs the
      # shipped runtime does not have.
      - dependency-name: '@types/node'
        versions: ['>=23']

  - package-ecosystem: github-actions
    directory: '/'
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
