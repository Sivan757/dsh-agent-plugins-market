version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The DSH host pins React 18 (dsh-client-ui-* peers: ^18.2.0) and the
      # client bundle consumes the host's runtime — follow the host, not upstream.
      - dependency-name: 'react'
        versions: ['>=19']
      - dependency-name: 'react-dom'
        versions: ['>=19']
      - dependency-name: '@types/react'
        versions: ['>=19']
      - dependency-name: '@types/react-dom'
        versions: ['>=19']
      # TypeScript 6 drops ambient node types (TS2591 across src/) — a real
      # migration with a tsconfig change, not a routine bump.
      - dependency-name: 'typescript'
        versions: ['>=6']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: '/docs-site'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
