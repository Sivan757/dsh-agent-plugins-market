version: 2
updates:
  # One npm entry covers the whole pnpm workspace, docs-site included. A second
  # entry for `/docs-site` split each bump in two — the manifest in one PR and
  # the shared lockfile in another — so neither PR installed under
  # `--frozen-lockfile`.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The DSH host pins React 18 (dsh-client-ui-* peers: ^18.2.0) and the
      # client bundle consumes the host's runtime — follow the host, not upstream.
      - dependency-name: 'react'
        versions: ['>=19']
      - dependency-name: 'react-dom'
        versions: ['>=19']
      - dependency-name: '@types/react'
        versions: ['>=19']
      - dependency-name: '@types/react-dom'
        versions: ['>=19']
      # TypeScript 6 drops ambient node types (TS2591 across src/) — a real
      # migration with a tsconfig change, not a routine bump.
      - dependency-name: 'typescript'
        versions: ['>=6']
      # `engines` starts at Node 22 and CI runs Node 22, so newer types would
      # type-check APIs the shipped runtime does not have.
      - dependency-name: '@types/node'
        versions: ['>=23']
      # This devDependency exists so vitest can inline the host's
      # dsh-client-ui-primitives, which renders TeX through katex and declares
      # ^0.16.47. Running the inlined copy against a newer major would test
      # rendering the host does not ship.
      - dependency-name: 'katex'
        versions: ['>=0.17']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
