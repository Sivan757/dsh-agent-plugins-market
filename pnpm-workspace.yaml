# Transitive dedupe: css-tree@3.2.1 declared ^1.2.1 and the lockfile kept the
# 1.2.1 resolution while postcss and css-tree@2.2.1 already carried 1.2.2.
# 1.2.2 fixes GHSA-68fv-2mgg-jv7q (indexed source-map section offsets).
overrides:
  # @deepseek-ai/dsh-agent-instructions peers on @deepseek-ai/dsh-home-paths
  # 0.2.1-rc.3 exactly, and the support range in dependencies
  # (>=0.2.0-rc.2 <0.3.0-0) cannot resolve a 0.2.1 prerelease: node-semver only
  # matches a prerelease of the same major.minor.patch a comparator names. The
  # dependency stays a range for consumers, and this override resolves the same
  # host baseline this repository builds against. Its 0.2.1 line also adds the
  # agents-home helpers the instruction loader imports.
  '@deepseek-ai/dsh-home-paths': 0.2.1-rc.3
  source-map-js: 1.2.2
  # @deepseek-ai/dsh-http-proxy declares undici "8.11.2" exactly, on 0.2.1-rc.3 and
  # on rc.2 alike, so no range and no targeted update can raise it. 8.12.2 is the
  # patch that clears the undici advisories, and it is the version jsdom already
  # resolved here, so this override also collapses the graph to one copy.
  undici: 8.12.2
  # @deepseek-ai/dsh-mcp-client declares @modelcontextprotocol/client "2.2.0"
  # exactly, on 0.2.1-rc.3 and on rc.2 alike. 2.3.0 is the first release that clears
  # its advisory, and its own exact @modelcontextprotocol/core "2.3.0" follows.
  '@modelcontextprotocol/client': 2.3.0
  # The host family pins zod exactly (4.4.3), and a plugin schema crosses into the
  # host's ProjectionDefinition. One physical copy is required: a second copy makes
  # the host's ZodType nominal, so the plugin's schema no longer matches it.
  # Dependabot keeps reporting zod < 4.6.6 as high severity. This override is the
  # accepted risk that alert asks you to fix: moving it breaks the host contract
  # above. Evidence and the reasoning are in .github/SECURITY.md.
  zod: 4.4.3

# The single ignore list for `pnpm audit`, which the release job runs with
# `--audit-level high`. Each entry here is a row in the accepted-risk table in
# .github/SECURITY.md, which carries the reason and what would close it.
#
# Revisit each entry when the host moves off the range that forces it:
#   GHSA-mrhx-c7xc-m3w5  zod    host family pins 4.4.3 exactly
#   GHSA-238p-pmpm-9mq7  katex  mirrors the host's ^0.16.47 TeX renderer
# Remove the line when the advisory no longer matches the resolved graph; an
# entry that ignores nothing is caught by `pnpm audit` reporting it unused.
auditConfig:
  ignoreGhsas:
    - GHSA-mrhx-c7xc-m3w5
    - GHSA-238p-pmpm-9mq7
