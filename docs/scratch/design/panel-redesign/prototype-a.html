<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>市场面板原型 A（输出风格不分组）</title>
    <style>
      :root {
        --bg: #191919;
        --layer1: #202020;
        --layer2: #262626;
        --hover: #2a2a2a;
        --active: #333;
        --border: #333;
        --border2: #3d3d3d;
        --text: #ececec;
        --text2: #9a9a9a;
        --text3: #6f6f6f;
        --green: #3fbf6f;
        --blue: #4c8dff;
        --amber: #d9a441;
        --red: #e5534b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font:
          400 13px/1.5 -apple-system,
          'SF Pro Text',
          'PingFang SC',
          sans-serif;
      }
      .stage {
        max-width: 1120px;
        margin: 0 auto;
      }

      .wrap {
        position: relative;
        display: flex;
        width: 100%;
        min-width: 0;
        flex: none;
      }
      .rail {
        display: flex;
        gap: 2px;
        flex: 1;
        min-width: 0;
        padding: 4px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--hover);
        overflow-x: auto;
        scrollbar-width: none;
        scroll-behavior: smooth;
      }
      .rail::-webkit-scrollbar {
        display: none;
      }
      .tab {
        flex: none;
        padding: 5px 10px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--text2);
        font: inherit;
        font-size: 14px;
        cursor: pointer;
        white-space: nowrap;
      }
      .tab:hover {
        color: var(--text);
        background: var(--hover);
      }
      .tab[aria-selected='true'] {
        color: var(--text);
        background: var(--layer1);
      }
      .fade {
        position: absolute;
        top: 2px;
        bottom: 2px;
        width: 34px;
        border-radius: 9px;
        pointer-events: none;
        display: none;
      }
      .fade.left {
        left: 2px;
        background: linear-gradient(90deg, var(--hover) 55%, transparent);
      }
      .fade.right {
        right: 2px;
        background: linear-gradient(270deg, var(--hover) 55%, transparent);
      }
      .step {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 14px;
        height: 26px;
        display: none;
        align-items: center;
        justify-content: center;
        border: 0;
        background: transparent;
        color: var(--text2);
        cursor: pointer;
        opacity: 0;
        transition:
          opacity 140ms ease,
          color 140ms ease;
      }
      .step.left {
        left: 6px;
      }
      .step.right {
        right: 6px;
      }
      .wrap:hover .step {
        opacity: 1;
      }
      .wrap:hover .step:hover {
        color: var(--text);
      }

      .panel {
        display: none;
        margin-top: 14px;
      }
      .panel.active {
        display: block;
      }
      .head {
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }
      .head p {
        margin: 0;
        color: var(--text2);
      }
      .head .actions {
        margin-left: auto;
        display: flex;
        gap: 4px;
      }
      .iconbtn {
        width: 28px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--text2);
        cursor: pointer;
      }
      .iconbtn:hover {
        background: var(--hover);
        color: var(--text);
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 12px 0 14px;
      }
      .search {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 38px;
        padding: 0 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--layer1);
        color: var(--text3);
      }
      .search input {
        flex: 1;
        min-width: 0;
        border: 0;
        background: transparent;
        color: var(--text);
        font: inherit;
        outline: none;
      }
      .segments {
        display: inline-flex;
        padding: 3px;
        border-radius: 10px;
        background: var(--hover);
      }
      .seg {
        padding: 5px 12px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--text2);
        font: inherit;
        cursor: pointer;
      }
      .seg[aria-pressed='true'] {
        background: var(--layer1);
        color: var(--text);
      }
      .view {
        display: inline-flex;
        gap: 2px;
        padding: 3px;
        border-radius: 10px;
        background: var(--hover);
      }
      .view button {
        width: 28px;
        height: 28px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--text2);
        cursor: pointer;
      }
      .view button[aria-pressed='true'] {
        background: var(--layer1);
        color: var(--text);
      }

      .groupTitle {
        grid-column: 1 / -1;
        margin: 6px 0 0;
        color: var(--text2);
        font-weight: 400;
        font-size: 12px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 10px;
      }
      .cards.list {
        grid-template-columns: 1fr;
      }
      .card {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 14px 14px 12px 18px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--layer1);
        color: inherit;
        font: inherit;
        text-align: start;
        cursor: pointer;
      }
      .card::before {
        content: '';
        position: absolute;
        left: 0;
        top: 8px;
        bottom: 8px;
        width: 3px;
        border-radius: 3px;
        background: var(--green);
      }
      .card:hover {
        background: var(--layer2);
        border-color: var(--border2);
      }
      .card:focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 1px;
      }
      .card .name {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .card .tag {
        align-self: flex-start;
        width: fit-content;
        padding: 1px 7px;
        border-radius: 6px;
        background: var(--hover);
        color: var(--text2);
        font-size: 11px;
      }
      .card .desc {
        margin: 0;
        color: var(--text2);
        font-size: 12px;
        line-height: 18px;
      }
      .card .meta {
        color: var(--text3);
        font-size: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .empty {
        padding: 20px 2px;
        color: var(--text3);
        font-size: 12px;
      }

      .scrim {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgb(0 0 0 / 45%);
      }
      .scrim.open {
        display: flex;
      }
      .dialog {
        width: min(760px, calc(100vw - 48px));
        max-height: calc(100vh - 96px);
        display: flex;
        flex-direction: column;
        border: 1px solid var(--border2);
        border-radius: 12px;
        background: var(--layer2);
      }
      .dialog header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
      }
      .dialog header .name {
        font-family: ui-monospace, monospace;
      }
      .dialog header .close {
        margin-left: auto;
      }
      .dialog .body {
        padding: 14px 16px;
        overflow: auto;
      }
      .dialog textarea {
        width: 100%;
        min-height: 240px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--bg);
        color: var(--text);
        font:
          12px/1.6 ui-monospace,
          monospace;
        resize: vertical;
        outline: none;
      }
      .dialog footer {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 16px;
        border-top: 1px solid var(--border);
        color: var(--text3);
        font-size: 12px;
      }
      .dialog footer .grow {
        flex: 1;
      }
      .btn {
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid var(--border2);
        background: transparent;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }
      .btn:hover {
        background: var(--hover);
      }
      .btn.primary {
        border-color: transparent;
        background: var(--blue);
        color: #fff;
      }
      .btn.ghost {
        border-color: transparent;
        color: var(--red);
      }
      .legend {
        margin-top: 22px;
        padding: 12px 14px;
        border: 1px dashed var(--border2);
        border-radius: 10px;
        color: var(--text3);
        font-size: 12px;
      }
      .legend b {
        color: var(--text2);
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="wrap" id="wrap">
        <div class="rail" id="rail" role="tablist" aria-label="市场"></div>
        <span class="fade left" id="fadeLeft"></span>
        <span class="fade right" id="fadeRight"></span>
        <button class="step left" id="stepLeft" aria-label="向前一个">‹</button>
        <button class="step right" id="stepRight" aria-label="向后一个">›</button>
      </div>

      <section class="panel active" id="panel-instructions">
        <div class="head">
          <p>按宿主加载顺序列出会注入本会话的指令文件，可编辑、可删除。</p>
          <div class="actions"><button class="iconbtn" title="新建">＋</button><button class="iconbtn" title="刷新">⟳</button></div>
        </div>
        <div class="toolbar">
          <label class="search">🔍<input id="q1" placeholder="搜索路径或摘要…" /></label>
          <div class="segments" id="f1"></div>
          <div class="view"><button aria-pressed="true" data-view="grid">▦</button><button aria-pressed="false" data-view="list">☰</button></div>
        </div>
        <div class="cards" id="cards1"></div>
      </section>

      <section class="panel" id="panel-styles">
        <div class="head">
          <p>列出插件提供的输出风格，可查看正文；用户风格可新建与编辑。</p>
          <div class="actions"><button class="iconbtn" title="新建">＋</button><button class="iconbtn" title="刷新">⟳</button></div>
        </div>
        <div class="toolbar">
          <label class="search">🔍<input id="q2" placeholder="搜索风格名或说明…" /></label>
          <div class="segments" id="f2"></div>
          <div class="view"><button aria-pressed="true" data-view="grid">▦</button><button aria-pressed="false" data-view="list">☰</button></div>
        </div>
        <div class="cards" id="cards2"></div>
      </section>

      <p class="legend">
        <b>原型说明：</b
        >搜索即时过滤、分段计数可切换、网格/列表可切换、点卡片打开详情（可保存；系统提示词已存在的文件可删除）。页签行的箭头是竖长、无底色的浮层，只在鼠标进入该行时出现；被裁一侧的窄渐隐在边框之内。数据为演示样本。
      </p>
    </div>

    <div class="scrim" id="scrim">
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgName">
        <header><span class="name" id="dlgName"></span><span class="tag" id="dlgTag"></span> <button class="iconbtn close" id="dlgClose" aria-label="关闭">✕</button></header>
        <div class="body"><textarea id="dlgText" spellcheck="false"></textarea></div>
        <footer>
          <span id="dlgMeta"></span><span class="grow"></span>
          <button class="btn ghost" id="dlgDelete" hidden>删除</button>
          <button class="btn" id="dlgCancel">取消</button>
          <button class="btn primary" id="dlgSave">保存</button>
        </footer>
      </div>
    </div>

    <script>
      const TABS = ['市场', '技能', '专家', '快捷指令', '连接器', '系统提示词', '钩子', '输出风格', '语言引擎']
      const PANEL_OF = { 系统提示词: 'panel-instructions', 输出风格: 'panel-styles' }
      const rail = document.getElementById('rail')
      for (const name of TABS) {
        const b = document.createElement('button')
        b.className = 'tab'
        b.type = 'button'
        b.role = 'tab'
        b.textContent = name
        b.setAttribute('aria-selected', String(name === '系统提示词'))
        b.onclick = () => select(name)
        rail.append(b)
      }
      function select(name) {
        for (const b of rail.children) b.setAttribute('aria-selected', String(b.textContent === name))
        for (const el of document.querySelectorAll('.panel')) el.classList.toggle('active', el.id === PANEL_OF[name])
      }
      const wrap = document.getElementById('wrap')
      function sync() {
        const left = rail.scrollLeft > 2
        const right = rail.scrollLeft + rail.clientWidth < rail.scrollWidth - 2
        for (const [el, show] of [
          [document.getElementById('fadeLeft'), left],
          [document.getElementById('fadeRight'), right],
          [document.getElementById('stepLeft'), left],
          [document.getElementById('stepRight'), right]
        ]) {
          el.style.display = show ? (el.classList.contains('step') ? 'inline-flex' : 'block') : 'none'
        }
      }
      rail.addEventListener('scroll', sync)
      window.addEventListener('resize', sync)
      document.getElementById('stepLeft').onclick = () => rail.scrollBy({ left: -110, behavior: 'smooth' })
      document.getElementById('stepRight').onclick = () => rail.scrollBy({ left: 110, behavior: 'smooth' })

      /* 只有存在的文件才列出：不存在的文件不能被看见、找到或使用。 */
      const instructions = [
        {
          id: 'user-global',
          name: '~/.dsh/AGENTS.md',
          tag: '已加载',
          desc: '全局工作协议：判断与决策、执行边界、证据与验证、语言与文档。',
          meta: '6 880 字节',
          text: '# Global Working Agreement\n\nWork with me as a technical lead...'
        },
        { id: 'agents-global', name: '~/.agents/AGENTS.md', tag: '重复', desc: '内容与上一份相同，宿主按重复项折叠处理。', meta: '6 880 字节', text: '# Global Working Agreement' }
      ]
      /* 输出风格来自插件解析，不是内置对象。 */
      const styles = [
        { id: 'adhd', name: 'adhd', tag: '插件', desc: '短句、直给结论，先行动后解释。', meta: 'adhd-output-style', text: 'Be terse. Lead with the action.' },
        {
          id: 'modernize',
          name: 'modernize',
          tag: '插件',
          desc: '按现代化阶段推进：评估、抽取规则、重建、复核。',
          meta: 'code-modernization',
          text: 'Follow the modernization stages.'
        },
        { id: 'review', name: 'review', tag: '插件', desc: '只报告高置信度问题，每条给出文件与行号。', meta: 'toolkit', text: 'Report only high-confidence findings.' },
        {
          id: 'my-style',
          name: 'my-style',
          tag: '用户',
          desc: '中文作答，先结论，步骤不超过五条。',
          meta: '~/.dsh/output-styles/my-style.md',
          text: '用中文回答；先给结论；步骤不超过五条。'
        }
      ]

      const state = { 1: { q: '', filter: 'all', view: 'grid' }, 2: { q: '', filter: 'all', view: 'grid' } }
      const FILTERS = {
        1: [
          ['all', '全部 {n}'],
          ['loaded', '已加载 {n}', '已加载'],
          ['dup', '重复 {n}', '重复']
        ],
        2: [
          ['all', '全部 {n}'],
          ['plugin', '插件 {n}', '插件'],
          ['user', '用户 {n}', '用户']
        ]
      }
      const DATA = { 1: instructions, 2: styles }
      function countFor(key, id) {
        const meta = FILTERS[key].find(f => f[0] === id)
        return id === 'all' ? DATA[key].length : DATA[key].filter(i => i.tag === meta[2]).length
      }
      function renderSegments(key) {
        const host = document.getElementById('f' + key)
        host.innerHTML = ''
        for (const [id, label] of FILTERS[key]) {
          const b = document.createElement('button')
          b.className = 'seg'
          b.type = 'button'
          b.textContent = label.replace('{n}', String(countFor(key, id)))
          b.setAttribute('aria-pressed', String(state[key].filter === id))
          b.onclick = () => {
            state[key].filter = id
            render(key)
          }
          host.append(b)
        }
      }
      function cardOf(item, key) {
        const card = document.createElement('button')
        card.className = 'card'
        card.type = 'button'
        card.innerHTML = '<span class="name"></span><span class="tag"></span>' + (item.desc ? '<p class="desc"></p>' : '') + (item.meta ? '<span class="meta"></span>' : '')
        card.querySelector('.name').textContent = item.name
        card.querySelector('.tag').textContent = item.tag
        if (item.desc) card.querySelector('.desc').textContent = item.desc
        if (item.meta) card.querySelector('.meta').textContent = item.meta
        card.onclick = () => openDialog(item, key)
        return card
      }
      function render(key) {
        renderSegments(key)
        const host = document.getElementById('cards' + key)
        host.className = 'cards' + (state[key].view === 'list' ? ' list' : '')
        host.innerHTML = ''
        const meta = FILTERS[key].find(f => f[0] === state[key].filter)
        const needle = state[key].q.trim().toLowerCase()
        const shown = DATA[key].filter(
          i => (state[key].filter === 'all' || i.tag === meta[2]) && (needle === '' || i.name.toLowerCase().includes(needle) || i.desc.toLowerCase().includes(needle))
        )
        if (shown.length === 0) {
          host.innerHTML = '<p class="empty">没有匹配的条目。</p>'
          return
        }

        for (const item of shown) host.append(cardOf(item, key))
      }
      document.getElementById('q1').oninput = e => {
        state[1].q = e.target.value
        render(1)
      }
      document.getElementById('q2').oninput = e => {
        state[2].q = e.target.value
        render(2)
      }
      for (const group of document.querySelectorAll('.view')) {
        const key = group.closest('.panel').id.endsWith('instructions') ? 1 : 2
        group.querySelectorAll('button').forEach(b => {
          b.onclick = () => {
            state[key].view = b.dataset.view
            group.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)))
            render(key)
          }
        })
      }

      let current = null
      let currentKey = 1
      function openDialog(item, key) {
        current = item
        currentKey = key
        document.getElementById('dlgName').textContent = item.name
        document.getElementById('dlgTag').textContent = item.tag
        document.getElementById('dlgText').value = item.text
        document.getElementById('dlgMeta').textContent = item.meta
        document.getElementById('dlgDelete').hidden = !(key === 1)
        document.getElementById('scrim').classList.add('open')
      }
      function closeDialog() {
        document.getElementById('scrim').classList.remove('open')
      }
      document.getElementById('dlgClose').onclick = closeDialog
      document.getElementById('dlgCancel').onclick = closeDialog
      document.getElementById('dlgDelete').onclick = closeDialog
      document.getElementById('dlgSave').onclick = () => {
        if (current) {
          current.text = document.getElementById('dlgText').value
          render(currentKey)
        }
        closeDialog()
      }
      document.getElementById('scrim').addEventListener('click', e => {
        if (e.target.id === 'scrim') closeDialog()
      })
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') closeDialog()
      })

      render(1)
      render(2)
      sync()
    </script>
  </body>
</html>
